<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SportLink | 運動教練與代課媒合</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#142c3b;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{background:#fff;border-bottom:1px solid #e4ebef;position:sticky;top:0;z-index:5}.nav{max-width:1180px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850;color:#12394d;margin-right:auto}.brand span{color:#13a77e}.nav button{background:none;color:#375265;padding:8px}.nav button.active{color:#07946f;font-weight:750}.nav .login{background:#103b50;color:white;border-radius:10px;padding:10px 15px}.wrap{max-width:1180px;margin:auto;padding:28px 22px 60px}.hero{background:linear-gradient(125deg,#10394e,#176b68);color:white;border-radius:23px;padding:48px 45px;display:grid;grid-template-columns:1.2fr .8fr;gap:25px}.hero h1{font-size:clamp(30px,4vw,49px);line-height:1.25;margin:12px 0}.hero p{color:#d4ece8;line-height:1.8}.hero .art{display:grid;place-content:center;text-align:center;font-size:92px;background:#ffffff13;border-radius:20px}.btn{background:#0aa67b;color:#fff;padding:12px 19px;border-radius:11px;font-weight:700}.btn.secondary{background:#e8f5f1;color:#08775a}.btn.ghost{background:#fff;color:#12536a}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.section{margin-top:32px}.section h2{font-size:23px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #e3eaee;border-radius:16px;padding:21px;box-shadow:0 4px 16px #173e4d08}.card h3{margin:6px 0 9px}.muted{color:#698090;font-size:14px}.pill{display:inline-block;border-radius:30px;background:#e3f6ef;color:#098261;font-size:12px;padding:5px 10px;font-weight:700}.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:19px}.field{padding:12px;border:1px solid #d7e3e9;border-radius:10px;background:white;min-width:160px;max-width:100%}.card-top{display:flex;align-items:center;gap:14px}.avatar{height:60px;width:60px;background:#e5f4f0;border-radius:14px;display:grid;place-items:center;font-size:29px}.price{color:#088766;font-weight:800;font-size:19px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card p{line-height:1.65}.empty{padding:28px;text-align:center;color:#698090}.panel{max-width:650px;margin:auto}.form{display:grid;gap:13px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:12px;border:1px solid #d8e3e8;border-radius:10px;background:white;margin-top:5px}.form textarea{min-height:80px}.notice{padding:13px;background:#e8f6f1;border-radius:10px;color:#116d55;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{padding:10px 14px;border-radius:9px;background:#e9eff2;color:#395463}.tabs button.active{background:#103e50;color:white}.list{display:grid;gap:11px}.item{background:white;border:1px solid #e2eaf0;border-radius:12px;padding:16px}.small{font-size:13px}.foot{text-align:center;color:#8496a0;padding:25px;border-top:1px solid #e1e9ed}.hidden{display:none!important}@media(max-width:750px){.hero{grid-template-columns:1fr;padding:28px}.hero .art{display:none}.grid{grid-template-columns:1fr}.nav{gap:6px}.nav button{font-size:13px;padding:7px}.brand{width:100%}.wrap{padding:18px 15px 40px}}
</style></head><body><header><div class="nav"><div class="brand">Sport<span>Link</span></div><button data-page="home">首頁</button><button data-page="coaches">找教練</button><button data-page="substitutions">找代課</button><button data-page="dashboard">我的中心</button><button class="login" data-page="account">登入 / 身分</button></div></header><main class="wrap" id="app"></main><footer class="foot">SportLink V1 · 單一城市試營運互動原型 · 資料僅供示範</footer><script>
const coaches=[{id:1,name:'陳怡安',sport:'游泳',area:'大安區',price:900,years:6,icon:'🏊',desc:'兒童游泳、成人初學與水中安全教學',certificate:'游泳教練證照（示範）'},{id:2,name:'林子翔',sport:'羽球',area:'中山區',price:1200,years:8,icon:'🏸',desc:'羽球初階至進階技術與步伐訓練',certificate:'羽球教練證照（示範）'},{id:3,name:'王佳蓉',sport:'健身',area:'信義區',price:1500,years:5,icon:'🏋️',desc:'肌力訓練、核心與體能提升',certificate:'體適能教練證照（示範）'},{id:4,name:'張家豪',sport:'籃球',area:'士林區',price:800,years:4,icon:'🏀',desc:'青少年籃球基礎與團隊訓練',certificate:'籃球教練證照（示範）'}];
const initialJobs=[{id:1,sport:'游泳',area:'大安區',date:'2026-11-06',time:'14:00',hours:2,rate:800,detail:'兒童初級游泳課，需具備教學經驗',owner:'示範教練',status:'open'},{id:2,sport:'羽球',area:'中山區',date:'2026-11-08',time:'10:00',hours:2,rate:1100,detail:'成人雙打基礎課程',owner:'示範教練',status:'open'}];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('sl_'+k))??d}catch{return d}},save=(k,v)=>localStorage.setItem('sl_'+k,JSON.stringify(v));let user=load('user',null),bookings=load('bookings',[]),jobs=load('jobs',initialJobs),applications=load('applications',[]),page='home',sportFilter='全部',areaFilter='全部';const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(name,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${name}</button>`;const options=(arr,current)=>arr.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('');const coachCard=c=>`<div class="card"><div class="card-top"><div class="avatar">${c.icon}</div><div><h3>${c.name}</h3><div class="muted">${c.sport} · 台北市${c.area}</div></div></div><p>${c.desc}</p><div class="row"><div><span class="price">NT$${c.price}</span><span class="muted"> / 小時</span></div>${btn('查看 / 預約','coach:'+c.id)}</div></div>`;const jobCard=j=>`<div class="card"><div class="row"><span class="pill">${esc(j.sport)}代課</span><b class="price">NT$${Number(j.rate).toLocaleString()} / 小時</b></div><h3>台北市${esc(j.area)} · ${esc(j.date)}</h3><p class="muted">${esc(j.time)} 開始 · ${esc(j.hours)} 小時</p><p>${esc(j.detail)}</p><div class="row"><span class="muted">${j.status==='open'?'招募中':'已媒合'}</span>${btn('查看 / 申請','job:'+j.id,'btn secondary')}</div></div>`;
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')app.innerHTML=`<section class="hero"><div><span class="pill">📍 台北市試營運</span><h1>找到好教練，<br>也找到下一個機會。</h1><p>學生輕鬆預約專業運動教練；教練管理課程、尋找學生，也能快速發布與承接代課。</p><div class="hero-actions">${btn('探索運動教練','go:coaches')}${btn('尋找代課機會','go:substitutions','btn ghost')}</div></div><div class="art">🏊 🏸<br>🏀 🏋️</div></section><section class="section"><h2>你可以在 SportLink 做什麼？</h2><div class="grid"><div class="card"><h3>🎓 學生找教練</h3><p>依運動種類、地區和價格找到合適的課程。</p>${btn('找教練','go:coaches','btn secondary')}</div><div class="card"><h3>💪 教練管理課程</h3><p>建立教練身分，接收預約並管理自己的教學行程。</p>${btn('進入管理中心','go:dashboard','btn secondary')}</div><div class="card"><h3>🔄 教練代課媒合</h3><p>發布代課需求，或申請其他教練提供的機會。</p>${btn('找代課','go:substitutions','btn secondary')}</div></div></section><section class="section"><div class="row"><h2>精選教練 · 示範資料</h2>${btn('查看全部','go:coaches','btn secondary')}</div><div class="grid">${coaches.slice(0,3).map(coachCard).join('')}</div></section>`;
else if(page==='coaches')app.innerHTML=`<h1>尋找運動教練</h1><p class="muted">目前試營運地區：台北市 · 教練均為示範資料</p><div class="filters"><select class="field" id="sportFilter">${options(['全部','游泳','羽球','健身','籃球'],sportFilter)}</select><select class="field" id="areaFilter">${options(['全部','大安區','中山區','信義區','士林區'],areaFilter)}</select></div><div class="grid">${coaches.filter(c=>(sportFilter==='全部'||c.sport===sportFilter)&&(areaFilter==='全部'||c.area===areaFilter)).map(coachCard).join('')||'<div class="empty">沒有符合條件的教練</div>'}</div>`;
else if(page.startsWith('coach:')){let c=coaches.find(x=>x.id===+page.split(':')[1]);app.innerHTML=`<div class="panel card"><div class="card-top"><div class="avatar">${c.icon}</div><div><h1>${c.name}</h1><div class="muted">${c.sport} · 台北市${c.area}</div></div></div><p>${c.desc}</p><p>教學經驗：${c.years} 年</p><p>專業證照：${c.certificate}</p><p class="price">NT$${c.price} / 小時</p><hr><h3>提出課程預約</h3><form class="form" id="bookingForm"><label>上課日期<input name="date" type="date" min="2026-10-29" required></label><label>上課時間<input name="time" type="time" required></label><label>備註<textarea name="note" placeholder="例如：第一次學游泳"></textarea></label><button class="btn">送出預約申請</button></form><p class="muted small">預約僅儲存於此瀏覽器，並非真實預約。</p></div>`;app.querySelector('#bookingForm').onsubmit=e=>{e.preventDefault();if(!user){alert('請先建立示範帳號');page='account';render();return}const f=new FormData(e.target);bookings.push({id:Date.now(),coach:c.name,sport:c.sport,date:f.get('date'),time:f.get('time'),note:f.get('note'),student:user.name,status:'待教練確認'});save('bookings',bookings);alert('預約申請已建立（示範）');page='dashboard';render()};}
else if(page==='substitutions')app.innerHTML=`<div class="row"><div><h1>代課媒合中心</h1><p class="muted">尋找合適的代課機會，或發布臨時代課需求。</p></div>${btn('＋ 發布代課需求','go:newjob')}</div><div class="grid">${jobs.filter(j=>j.status==='open').map(jobCard).join('')||'<p>目前沒有開放中的代課需求。</p>'}</div>`;
else if(page.startsWith('job:')){const j=jobs.find(x=>x.id===+page.split(':')[1]);if(!j){page='substitutions';render();return}app.innerHTML=`<div class="panel card"><span class="pill">${esc(j.sport)} · ${j.status==='open'?'招募中':'已媒合'}</span><h1>${esc(j.sport)}教練代課</h1><p>📍 台北市${esc(j.area)}</p><p>📅 ${esc(j.date)} ${esc(j.time)}，共 ${esc(j.hours)} 小時</p><p class="price">NT$${Number(j.rate).toLocaleString()} / 小時</p><p>${esc(j.detail)}</p>${j.status==='open'?btn('申請這個代課','apply:'+j.id):'<p class="notice">此需求已完成媒合</p>'}</div>`;}
else if(page==='newjob'){if(!user){page='account';render();return}app.innerHTML=`<div class="panel card"><h1>發布代課需求</h1><form class="form" id="jobForm"><label>運動項目<select name="sport">${options(['游泳','羽球','健身','籃球'],'游泳')}</select></label><label>台北市行政區<select name="area">${options(['大安區','中山區','信義區','士林區'],'大安區')}</select></label><label>代課日期<input name="date" type="date" min="2026-10-29" required></label><label>開始時間<input name="time" type="time" required></label><label>時數<input name="hours" type="number" min="1" max="12" value="2" required></label><label>時薪（新台幣）<input name="rate" type="number" min="1" required></label><label>需求說明<textarea name="detail" required placeholder="學生程度、證照要求、場地資訊"></textarea></label><button class="btn">發布代課需求</button></form></div>`;app.querySelector('#jobForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);jobs.unshift({id:Date.now(),sport:f.get('sport'),area:f.get('area'),date:f.get('date'),time:f.get('time'),hours:Number(f.get('hours')),rate:Number(f.get('rate')),detail:f.get('detail'),owner:user.name,status:'open'});save('jobs',jobs);page='substitutions';render()};}
else if(page==='account')app.innerHTML=`<div class="panel card"><h1>示範帳號</h1><p class="muted">這是原型模式，不需真實密碼；資料只存在目前瀏覽器。</p>${user?`<p class="notice">目前使用者：${esc(user.name)}（${esc(user.role)}）</p>${btn('登出示範帳號','logout','btn secondary')}`:`<form class="form" id="accountForm"><label>顯示名稱<input name="name" required maxlength="30" placeholder="請輸入暱稱，避免使用真實個資"></label><label>主要身分<select name="role"><option>學生</option><option>教練</option></select></label><button class="btn">進入示範平台</button></form>`}</div>`;if(!user)app.querySelector('#accountForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);user={name:f.get('name'),role:f.get('role')};save('user',user);page='dashboard';render()};
else if(page==='dashboard'){if(!user){page='account';render();return}let mine=bookings.filter(b=>b.student===user.name||coaches.some(c=>c.name===user.name&&c.name===b.coach)),myjobs=jobs.filter(j=>j.owner===user.name),myapps=applications.filter(a=>a.applicant===user.name);app.innerHTML=`<h1>你好，${esc(user.name)} 👋</h1><p class="muted">目前身分：${esc(user.role)} · 示範會員中心</p><div class="tabs">${btn('切換成學生','role:學生',user.role==='學生'?'active':'')}${btn('切換成教練','role:教練',user.role==='教練'?'active':'')}${btn('發布代課','go:newjob','btn secondary')}</div><div class="section"><h2>我的課程預約</h2><div class="list">${mine.map(b=>`<div class="item"><div class="row"><b>${esc(b.sport)} · ${esc(b.coach)}</b><span class="pill">${esc(b.status)}</span></div><p class="muted">${esc(b.date)} ${esc(b.time)}</p>${b.status==='待教練確認'?btn('取消申請','cancel:'+b.id,'btn secondary'):''}</div>`).join('')||'<div class="item muted">目前沒有預約紀錄。</div>'}</div></div><div class="section"><h2>我發布的代課需求</h2><div class="list">${myjobs.map(j=>`<div class="item"><div class="row"><b>${esc(j.sport)} · ${esc(j.date)}</b><span class="pill">${j.status==='open'?'招募中':'已媒合'}</span></div><p class="muted">申請人：${applications.filter(a=>a.jobId===j.id).map(a=>esc(a.applicant)).join('、')||'尚無'}</p>${j.status==='open'?applications.filter(a=>a.jobId===j.id).map(a=>btn('接受 '+esc(a.applicant),'accept:'+j.id+':'+a.id,'btn secondary')).join(' '):''}</div>`).join('')||'<div class="item muted">尚未發布代課需求。</div>'}</div></div><div class="section"><h2>我的代課申請</h2><div class="list">${myapps.map(a=>`<div class="item"><b>${esc(a.sport)} · ${esc(a.date)}</b><p class="muted">狀態：${esc(a.status)}</p></div>`).join('')||'<div class="item muted">尚未申請代課。</div>'}</div></div>`;}
}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}let a=b.dataset.action;if(!a)return;let [cmd,id,extra]=a.split(':');if(cmd==='go'){page=id;render();window.scrollTo(0,0)}else if(cmd==='coach'||cmd==='job'){page=a;render();window.scrollTo(0,0)}else if(cmd==='apply'){if(!user){page='account';render();return}let j=jobs.find(x=>x.id===+id);if(j.owner===user.name){alert('不能申請自己的代課需求');return}if(applications.some(x=>x.jobId===j.id&&x.applicant===user.name)){alert('已經申請過這筆代課');return}applications.push({id:Date.now(),jobId:j.id,applicant:user.name,sport:j.sport,date:j.date,status:'待確認'});save('applications',applications);alert('代課申請已送出（示範）');page='dashboard';render()}else if(cmd==='accept'){let j=jobs.find(x=>x.id===+id),a=applications.find(x=>x.id===+extra);if(j.owner!==user?.name)return;j.status='matched';a.status='已接受';applications.filter(x=>x.jobId===j.id&&x.id!==a.id).forEach(x=>x.status='未獲選');save('jobs',jobs);save('applications',applications);render()}else if(cmd==='cancel'){let x=bookings.find(b=>b.id===+id);if(x&&x.student===user?.name){x.status='已取消';save('bookings',bookings);render()}}else if(cmd==='role'){user.role=id;save('user',user);render()}else if(cmd==='logout'){user=null;save('user',null);page='home';render()}});document.addEventListener('change',e=>{if(e.target.id==='sportFilter'){sportFilter=e.target.value;render()}if(e.target.id==='areaFilter'){areaFilter=e.target.value;render()}});render();
</script>
