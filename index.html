<!doctype html>
<html lang="zh-Hant">
<head>

  <meta name="application-name" content="SportLink">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./app.js"></script>

</head>
<body>
  <!-- Only visible when Chrome enables Window Controls Overlay. -->
  <div class="sl-window-titlebar" aria-label="SportLink 桌面應用程式標題列">
    <img src="./icon-192.png" alt="" width="20" height="20">
    <span class="sl-window-title">SportLink</span>
    <span class="sl-window-subtitle">運動教練媒合平台</span>

  <header class="site-header">
    <nav class="nav" aria-label="主要導覽">

      <button class="sl-mobile-menu-toggle" id="slMobileMenuToggle" type="button" aria-expanded="false" aria-controls="slMobileMenu" aria-label="開啟導覽選單"><span aria-hidden="true">☰</span><span>選單</span></button>
      <div class="nav-links" id="slMobileMenu">
        <button data-page="home">首頁</button>
        <button data-page="coaches">探索教練</button>
        <button data-page="substitutions">代課媒合</button>

      <button class="login" data-page="account">登入／註冊 <span aria-hidden="true">↗</span></button>

        <summary class="sl-member-trigger" aria-label="開啟會員選單"><span class="sl-member-initial" aria-hidden="true">會</span><span class="sl-member-name">會員</span><span class="sl-member-chevron" aria-hidden="true">⌄</span></summary>

      </details>
    </nav>
  </header>
  <main class="wrap" id="app"></main>
  <footer class="foot"><div class="footer-inner"><div><strong>SPORT<span>LINK</span><i>.</i></strong><p>讓專業運動教練與每一份熱愛相遇。</p></div><div class="footer-right">© 2026 SportLink · 運動教練媒合平台</div></div></footer>
